[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "limen"
dynamic = ["version"]
description = "Check that an experiment ran the way it claims: treatment applied, nothing else changed, gates that can fail, no held-out leaks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Lingrui Mei" }]
keywords = ["experiments", "reproducibility", "provenance", "validity", "agents", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Meirtz/Limen"
Issues = "https://github.com/Meirtz/Limen/issues"

[project.scripts]
limen = "limen.cli:main"

[tool.hatch.version]
path = "src/limen/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/limen"]

[tool.hatch.build.targets.sdist]
include = ["src/limen", "tests", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105", "RUF012"]

[tool.mypy]
python_version = "3.10"
files = ["src/limen"]
strict = true
warn_unused_ignores = false

[tool.ruff.lint.per-file-ignores]
# the bench's experiment loops and scenarios are deliberately written like ordinary user code
"bench/loops/**" = ["B905", "I001"]
"bench/scenarios/**" = ["E501", "E401", "I001", "B905"]
